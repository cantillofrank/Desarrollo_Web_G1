<form id="cvForm">
    <fieldset>
        <legend>1. Información Personal</legend> 
        <label>Nombre Completo: <input type="text" id="cvName"required></label> 
        <label>Título Profesional: <input type="text" id="cvTitle" required></label>
    </fieldset>
    <fieldset>
        <legend>2. Experiencia Laboral</legend>
        <div id="experienceContainer"></div> 
        <button type="button" id="addExpBtn" class="btn-secondary">+ Agregar Experiencia</button>
    </fieldset> 
    <button type="submit" class="btn-primary">Generar Vista CV</button>
</form>
