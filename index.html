<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidad II · Formularios avanzados</title>
    <!-- Font Awesome 6 (gratuito) para iconos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Estilos CSS personalizados -->
    <link rel="stylesheet" href="css/login2.css" />

</head>
  <body>
    <!-- Formulario con validación personalizada desactivando la nativa -->
    <form id="loginForm" novalidate>
      <h2>Iniciar Sesión</h2>

      <div class="form-group">
        <label for="loginEmail">correo electronico:</label>
        <input
        type="email"
        id="loginEmail"
        name="loginEmail"
        required
        placeholder="correo@unicaribe.edu.co"
        />
        <span class="error-message" id="emailError"></span>

       </div>

       <div class="form-group">
        <label for="loginPassword">contraseña:</label>
        <input
          type="password"
          id="loginPassword"
          name="loginPassword"
          required
          minlength="6"
          placeholder="********"
        />
        <span class="error-message" id="passwordError"></span>
       
       </div>

       <button type="submit" class="btn">Iniciar Sesión</button>
    </form>

    <div id="loginWelcome" style="display: none;" >
       <h2>Bienvenido</h2>
        <p>Has iniciado sesión correctamente.</p>
        <p>correo: <span id="userEmailDisplay"></span></p>
    </div>
  </body>

  <script src="/js/login.js"></script>

</html>
